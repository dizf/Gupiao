name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Validate web assets
        run: |
          node --check android/app/src/main/assets/app.js
          node --check android/app/src/main/assets/backtest.js
          node --check android/app/src/main/assets/ui.js
          node --check android/app/src/main/assets/features.js

      - name: Inject mobile UI and feature controllers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/assets/index.html")
          text = path.read_text(encoding="utf-8")
          marker = '<script src="features.js"></script>'
          if marker not in text:
              old = '<script src="app.js"></script><script src="backtest.js"></script>'
              new = old + '<script src="features.js"></script><script src="ui.js"></script>'
              if old in text:
                  text = text.replace(old, new)
              else:
                  text = text.replace('</body>', '<script src="features.js"></script><script src="ui.js"></script></body>')
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GupiaoSelector-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
